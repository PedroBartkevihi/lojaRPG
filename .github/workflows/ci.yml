name: CI

# Roda em todo push; o resultado tambem aparece nos PRs do branch.
on:
  push:
  workflow_dispatch:

jobs:
  backend:
    name: Back-end (lint e testes com PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lojarpg
          POSTGRES_PASSWORD: lojarpg
          POSTGRES_DB: lojarpg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lojarpg -d lojarpg_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lojarpg:lojarpg@127.0.0.1:5432/lojarpg_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Front-end (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:3001

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lojarpg
          POSTGRES_PASSWORD: lojarpg
          POSTGRES_DB: lojarpg_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lojarpg -d lojarpg_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://lojarpg:lojarpg@127.0.0.1:5432/lojarpg_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      # O Playwright sobe a API (com migrations e a mesa de demonstracao) e o
      # site de producao (vite build + preview); veja e2e/playwright.config.js.
      - run: npx playwright test
        working-directory: e2e
      # De novo, com o refresh token no cookie httpOnly (VITE_REFRESH_COOKIE),
      # nos fluxos de sessao, senha, compra e convite.
      - name: Ponta a ponta no modo cookie
        run: npx playwright test tests/sessao.spec.js tests/senha.spec.js tests/compra.spec.js tests/mesa-com-convite.spec.js
        working-directory: e2e
        env:
          E2E_REFRESH_COOKIE: 'true'
      - name: Guardar prints, videos e traces da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-falhas
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
