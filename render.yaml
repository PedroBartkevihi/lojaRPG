# Blueprint do Render: API (Node) e front-end (site estatico), ambos no plano
# gratuito. O banco PostgreSQL fica no Neon; veja a secao "Versao online" do
# DEPLOY.md para o passo a passo.
services:
  - type: web
    name: lojarpg-api
    runtime: node
    plan: free
    # O Render nao tem regiao na America do Sul; a API fica em Ohio, junto
    # do banco no Neon (AWS us-east-2), porque cada requisicao faz varias
    # consultas e a distancia entre os dois pesaria em todas elas.
    region: ohio
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate
    # Com DEMO_RESET_ON_START=true o seed recria a mesa de demonstracao e as
    # contas de exemplo a cada inicio (no plano gratuito, quando a API acorda
    # depois de 15 minutos parada). As outras mesas nao sao tocadas.
    startCommand: npx prisma migrate deploy && if [ "$DEMO_RESET_ON_START" = "true" ]; then node prisma/seed.js; fi && node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_RESET_ON_START
        value: "true"
      # Proxies do Render entre o usuario e a API. Confira no log da API a
      # linha "X-Forwarded-For com N endereco(s)" e use o N medido; em
      # outubro de 2026 eram 3.
      - key: TRUST_PROXY
        value: "3"

  - type: web
    name: lojarpg-web
    runtime: static
    # O Vite fica em devDependencies; --include=dev garante que ele seja
    # instalado mesmo se o ambiente de build tiver NODE_ENV=production.
    buildCommand: cd frontend && npm ci --include=dev && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Cabecalhos de seguranca do site. A CSP libera so a propria origem, a API
    # (troque a URL em connect-src se o nome da API mudar), as fontes do Google
    # e imagens HTTPS de qualquer lugar (as imagens dos itens sao URLs
    # externas). Os testes de ponta a ponta servem o site com estes mesmos
    # cabecalhos e falham se o navegador bloquear algo.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://lojarpg-api.onrender.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
