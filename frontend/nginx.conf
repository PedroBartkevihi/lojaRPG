server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Os mesmos cabecalhos de seguranca do site no Render (render.yaml). A API
  # local do docker compose fica em http://localhost:3001; numa instalacao com
  # outro endereco, troque-o em connect-src.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://localhost:3001 https://api.cloudinary.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
