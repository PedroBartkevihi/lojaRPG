services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lojarpg
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-lojarpg}"
      POSTGRES_DB: lojarpg
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - loja_rpg_pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lojarpg -d lojarpg"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      # Vem do .env da raiz (veja .env.example); a API recusa iniciar sem ele.
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_EXPIRES_IN: "15m"
      REFRESH_TOKEN_EXPIRES_IN_DAYS: 7
      CORS_ORIGIN: "http://localhost:8080"
      DATABASE_URL: "postgresql://lojarpg:${POSTGRES_PASSWORD:-lojarpg}@db:5432/lojarpg"
      # Recria a mesa de demonstracao a cada inicio (os botoes da tela de
      # entrada usam as contas dela); as outras mesas nao sao tocadas.
      DEMO_RESET_ON_START: "true"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:3001"
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  loja_rpg_pgdata:
